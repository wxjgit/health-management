worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 64; }
http {
    access_log off;
    server_tokens off;
    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    large_client_header_buffers 4 8k;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    limit_conn_zone $server_name zone=connections:1m;
    limit_req_zone $binary_remote_addr zone=requests:1m rate=20r/s;
    map $request_id $gateway_id {
        "~^(.{8})(.{4})(.{4})(.{4})(.{12})$" "$1-$2-$3-$4-$5";
    }
    server {
        listen 8080;
        limit_conn connections 24;
        limit_req zone=requests burst=24 nodelay;
        limit_req_status 503;
        error_page 400 = @error_400;
        location @error_400 {
            default_type application/json;
            add_header X-Request-ID $gateway_id always;
            return 400 '{"detail":"请求未完成，请刷新或使用原请求重试。","code":"http_400","request_id":"$gateway_id"}';
        }
        error_page 408 = @error_408;
        location @error_408 {
            default_type application/json;
            add_header X-Request-ID $gateway_id always;
            return 408 '{"detail":"请求未完成，请刷新或使用原请求重试。","code":"request_body_timeout","request_id":"$gateway_id"}';
        }
        error_page 413 = @error_413;
        location @error_413 {
            default_type application/json;
            add_header X-Request-ID $gateway_id always;
            return 413 '{"detail":"请求未完成，请刷新或使用原请求重试。","code":"request_body_too_large","request_id":"$gateway_id"}';
        }
        error_page 429 = @error_429;
        location @error_429 {
            default_type application/json;
            add_header X-Request-ID $gateway_id always;
            return 429 '{"detail":"请求未完成，请刷新或使用原请求重试。","code":"runtime_busy","request_id":"$gateway_id"}';
        }
        error_page 502 = @error_502;
        location @error_502 {
            default_type application/json;
            add_header X-Request-ID $gateway_id always;
            return 502 '{"detail":"请求未完成，请刷新或使用原请求重试。","code":"model_unavailable","request_id":"$gateway_id"}';
        }
        error_page 503 = @error_503;
        location @error_503 {
            default_type application/json;
            add_header X-Request-ID $gateway_id always;
            return 503 '{"detail":"请求未完成，请刷新或使用原请求重试。","code":"runtime_busy","request_id":"$gateway_id"}';
        }
        error_page 504 = @error_504;
        location @error_504 {
            default_type application/json;
            add_header X-Request-ID $gateway_id always;
            return 504 '{"detail":"请求未完成，请刷新或使用原请求重试。","code":"execution_deadline_exceeded","request_id":"$gateway_id"}';
        }
        location / {
            proxy_pass http://172.30.80.3:8000;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_connect_timeout 3s;
            proxy_read_timeout 155s;
            proxy_send_timeout 10s;
            proxy_next_upstream off;
            proxy_set_header Connection "";
            proxy_set_header Host localhost;
        }
        location ^~ /internal/ { return 404; }
    }
}
