http_port 172.30.81.2:3128
visible_hostname qingji-egress
pid_filename /tmp/squid.pid
cache_log /dev/stderr
access_log none
cache_store_log none
logfile_rotate 0
cache deny all
cache_mem 8 MB
pinger_enable off
shutdown_lifetime 1 seconds
httpd_suppress_version_string on
acl application src 172.30.81.3/32
acl connect method CONNECT
acl tls_port port 443
# No leading dot: exact host only. Keep in sync with MODEL_ALLOWED_HOSTS.
acl provider dstdomain dashscope.aliyuncs.com
# dst is resolved before opening the tunnel, including private CNAME targets.
acl forbidden dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4 ::/128 ::1/128 ::ffff:0:0/96 fc00::/7 fe80::/10 ff00::/8 2001:db8::/32
acl literal url_regex -i ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+: ^\[
http_access deny !application
http_access deny !connect
http_access deny !tls_port
http_access deny literal
http_access deny !provider
http_access deny forbidden
http_access allow application connect tls_port provider
http_access deny all
dns_nameservers 1.1.1.1 1.0.0.1
connect_timeout 5 seconds
request_timeout 10 seconds
read_timeout 10 seconds
client_lifetime 60 seconds
maximum_object_size 0 KB
